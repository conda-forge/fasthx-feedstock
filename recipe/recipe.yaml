schema_version: 1

context:
  name: fasthx
  version: "3.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fasthx-${{ version }}.tar.gz
  sha256: a35c760246f87e54dec0b0aafc2c84b33549dfc8277ab4be7fb373c54c57493d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi >=0.135.0

tests:
  - python:
      imports:
        - fasthx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: FastAPI data APIs with HTMX support.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/volfpeter/fasthx
  documentation: https://volfpeter.github.io/fasthx/

extra:
  recipe-maintainers:
    - davidbrochart
    - thewchan
